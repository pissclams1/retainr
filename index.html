    <!-- Structured Data: FAQPage (AEO / AI answer targeting) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a BindIQ Score?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A BindIQ Score is a 0–100 rating that tells Florida insurance agents how likely a property is to bind with standard carriers. It is calculated by analyzing 4-point and wind mitigation inspection reports for underwriting risk factors like electrical panel type, roof age, plumbing material, and opening protection."
          }
        },
        {
          "@type": "Question",
          "name": "What inspection forms does BindIQ support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BindIQ supports Florida 4-point inspection reports and wind mitigation reports (OIR-B1-1802). Additional state forms are being added."
          }
        },
        {
          "@type": "Question",
          "name": "What underwriting issues does BindIQ detect?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BindIQ automatically flags Federal Pacific and Zinsco electrical panels, aluminum branch wiring, knob-and-tube wiring, polybutylene plumbing, roof age over 25 years, poor roof condition, and open gable geometry — the most common reasons Florida carriers decline or restrict coverage."
          }
        },
        {
          "@type": "Question",
          "name": "How long does BindIQ take to score a report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BindIQ typically scores a report in under 60 seconds. Upload or paste the inspection report text and the BindIQ Score is returned with red flags and carrier impact notes."
          }
        },
        {
          "@type": "Question",
          "name": "How much does BindIQ cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BindIQ offers three plans: Starter at $79/month for up to 50 reports, Pro at $149/month for up to 200 reports with intake links, and Agency at $299/month for 500+ reports with multi-user access. All plans include a 14-day free trial."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between a 4-point inspection and a wind mitigation report?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A 4-point inspection covers four systems: roof, HVAC, plumbing, and electrical. Florida insurers require it for homes typically over 20–30 years old. A wind mitigation report (OIR-B1-1802) evaluates how well a home resists wind damage — covering roof covering type, deck attachment, roof-to-wall connections, geometry, secondary water resistance, and opening protection. Wind mitigation credits can significantly reduce homeowners insurance premiums."
          }
        }
      ]
    }
    </script>
