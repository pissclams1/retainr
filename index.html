<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>PublishReady — KDP-ready ebook and paperback files</title><meta name="description" content="Check ebook and paperback manuscript and cover files for Amazon KDP without learning its technical rules."/><meta name="theme-color" content="#ffffff"/><meta name="robots" content="index,follow"/><meta property="og:title" content="PublishReady — Your book is done. Publish it right."/><meta property="og:description" content="eBook and paperback files checked against Amazon KDP requirements."/><meta property="og:type" content="website"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';window.pdfjsLib=pdfjsLib;</script><script>const cleanUnsupportedHardcover=()=>{document.querySelectorAll('#pricing label.option').forEach(label=>{if(/hardcover/i.test(label.textContent))label.remove()});document.querySelectorAll('#pricing p').forEach(p=>{if(/complete six-deliverable package/i.test(p.textContent))p.textContent='First deliverable $19. Each additional deliverable $10. A complete four-deliverable ebook and paperback package is $49.'});document.querySelectorAll('#checker .drop span').forEach(span=>{if(/paperback or hardcover interior/i.test(span.textContent))span.textContent='Paperback interior'});};new MutationObserver(cleanUnsupportedHardcover).observe(document.d
