<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>PublishReady — Find and fix KDP file problems</title><meta name="description" content="PublishReady finds KDP problems in ebook and paperback files, explains the correction, and safely repairs supported errors before submission."/><meta name="theme-color" content="#ffffff"/><meta name="robots" content="index,follow"/><meta property="og:title" content="PublishReady — Find it. Fix it. Publish it."/><meta property="og:description" content="Find KDP file problems, get exact corrections, and automatically repair supported errors before submission."/><meta property="og:type" content="website"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script type="module">import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';window.pdfjsLib=pdfjsLib;</script><style>#pr-launch{position:sticky;top:0;z-index:9999;background:#111827;color:#fff;padding:10px 18px;text-align:center;font:600 14px/1.4 'DM Sans',sans-serif}#pr-launch strong{color:#a7f3d0}.pr-modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.72);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px}.pr-modal-backdrop.open{display:flex}.pr-modal{width:min(480px,100%);background:#fff;border-radius:18px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.25);font-family:'DM Sans',sans-serif}.pr-modal h2{margin:0 0 8px;font-size:26px}.pr-modal p{color:#475569;margin:0 0 18px}.pr-modal label{display:block;font-weight:700;margin-bottom:8px}.pr-modal input{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;padding:13px 14px;font:inherit}.pr-modal-actions{display:flex;gap:10px;margin-top:16px}.pr-modal button{border:0;border-radius:10px;padding:12px 16px;font:700 14px 'DM Sans',sans-serif;cursor:pointer}.pr-submit{background:#111827;color:#fff;flex:1}.pr-cancel{background:#e2e8f0;color:#0f172a}.pr-status{min-height:22px;margin-top:12px;font-size:13px;color:#b91c1c}.pr-fine{font-size:12px;color:#64748b;margin-top:12px}</style><script>const LAUNCH_END=new Date('2026-06-22T23:59:59-04:00');const launchActive=()=>Date.now()<=LAUNCH_END.getTime();const alignProductCopy=()=>{document.querySelectorAll('#pricing label.option').forEach(label=>{if(/hardcover/i.test(label.textContent))label.remove()});document.querySelectorAll('#pricing p').forEach(p=>{if(/complete six-deliverable package/i.test(p.textContent))p.textContent='First deliverable $19. Each additional deliverable $10. A complete four-deliverable ebook and paperback package is $49.'});document.querySelectorAll('#pricing .price-summary small').forEach(s=>{if(/beta/i.test(s.textContent))s.textContent='Paid corrections open after launch week.'});document.querySelectorAll('#checker .drop span').forEach(span=>{if(/paperback or hardcover interior/i.test(span.textContent))span.textContent='Paperback interior'});document.querySelectorAll('h1').forEach(h=>{if(/your book is done/i.test(h.textContent))h.innerHTML='Your book is done.<br><span>Now make the files publish-ready.</span>'});document.querySelectorAll('.hero .lead').forEach(p=>p.textContent='PublishReady finds KDP problems, tells you exactly what must change, and automatically corrects supported file errors before you submit.');document.querySelectorAll('.hero-proof h3').forEach(h=>{if(/production checks/i.test(h.textContent))h.textContent='Find, explain, and correct KDP file problems'});document.querySelectorAll('.hero-proof strong').forEach(s=>{if(/canned rejection/i.test(s.textContent))s.textContent='Not another rejection notice.'});document.querySelectorAll('.hero-proof .proof-note').forEach(p=>p.textContent='KDP tells you a file failed. PublishReady identifies the cause, gives the correction, and repairs supported errors when it can do so safely.');document.querySelectorAll('.checker-heading .eyebrow').forEach(e=>e.textContent='Launch week free');document.querySelectorAll('.checker-heading h2').forEach(h=>h.textContent='Find the problems. Fix what can be fixed.');document.querySelectorAll('.checker-heading p').forEach(p=>p.textContent='Upload the files you already have. PublishReady inspects the actual files, explains every issue, and offers verified corrections for supported errors.');document.querySelectorAll('#faq p').forEach(p=>{if(/This beta provides/i.test(p.textContent))p.textContent=p.textContent.replace(/This beta provides/i,'PublishReady provides')});document.querySelectorAll('.legal h2').forEach(h=>h.textContent='Terms');document.querySelectorAll('.legal p').forEach(p=>{p.textContent=p.textContent.replace(/Current beta processing/gi,'Current processing').replace(/Because the validation beta is free/gi,'Because launch week access is free')});document.querySelectorAll('footer span').forEach(s=>{if(/Validation Beta/i.test(s.textContent))s.textContent='© 2026 PublishReady · Find it. Fix it. Publish it.'});document.querySelectorAll('body *:not(script):not(style)').forEach(el=>{for(const node of el.childNodes){if(node.nodeType===Node.TEXT_NODE&&/\bbeta\b/i.test(node.nodeValue))node.nodeValue=node.nodeValue.replace(/\bbeta\b/gi,'service')}})};const injectLaunchUi=()=>{if(!document.getElementById('pr-launch')){const banner=document.createElement('div');banner.id='pr-launch';banner.innerHTML=launchActive()?'<strong>Launch Week:</strong> full file inspection, correction guidance, and supported automatic repairs are free through June 22. One book package per email.':'Launch week has ended. Basic inspection remains free; full correction reports and repairs are moving to paid access.';document.body.prepend(banner)}if(!document.getElementById('pr-email-modal')){const wrap=document.createElement('div');wrap.id='pr-email-modal';wrap.className='pr-modal-backdrop';wrap.innerHTML='<div class="pr-modal" role="dialog" aria-modal="true" aria-labelledby="pr-modal-title"><h2 id="pr-modal-title">Unlock the full correction report</h2><p>Launch week is free. Enter your email to download every detected problem, the required correction, and any supported repaired files for this book package.</p><form id="pr-email-form"><label for="pr-email">Email</label><input id="pr-email" name="email" type="email" required autocomplete="email" placeholder="you@example.com"><div class="pr-modal-actions"><button class="pr-cancel" type="button">Cancel</button><button class="pr-submit" type="submit">Unlock Corrections</button></div><div class="pr-status" aria-live="polite"></div><div class="pr-fine">No file contents are sent. Only your email and anonymous package settings are recorded.</div></form></div>';document.body.appendChild(wrap);wrap.querySelector('.pr-cancel').onclick=()=>wrap.classList.remove('open');wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.classList.remove('open')});wrap.querySelector('form').addEventListener('submit',submitLaunchEmail)}}};let pendingReportButton=null;let bypassGate=false;async function submitLaunchEmail(event){event.preventDefault();const form=event.currentTarget;const status=form.querySelector('.pr-status');const button=form.querySelector('.pr-submit');const email=form.email.value.trim();if(!email)return;button.disabled=true;status.textContent='Unlocking corrections…';const payload={email,_subject:'PublishReady launch-week signup',event:'full_correction_report_unlock',trim:document.querySelector('#checker select')?.value||'',timestamp:new Date().toISOString(),_captcha:'false',_template:'table'};try{const response=await fetch('https://formsubmit.co/ajax/andreas11735@gmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw new Error('capture failed');localStorage.setItem('publishready_launch_email',email);status.style.color='#047857';status.textContent='Unlocked. Downloading your correction report…';setTimeout(()=>{document.getElementById('pr-email-modal').classList.remove('open');bypassGate=true;pendingReportButton?.click();bypassGate=false;pendingReportButton=null;button.disabled=false;status.textContent=''},400)}catch(error){status.textContent='Could not unlock the report. Please try again.';button.disabled=false}}document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.textContent.trim()!=='Download results'||bypassGate)return;if(!launchActive())return;const saved=localStorage.getItem('publishready_launch_email');if(saved)return;event.preventDefault();event.stopImmediatePropagation();pendingReportButton=button;injectLaunchUi();document.getElementById('pr-email-modal').classList.add('open')},true);const boot=()=>{alignProductCopy();injectLaunchUi()};new MutationObserver(alignProductCopy).observe(document.documentElement,{childList:true,subtree:true});window.addEventListener('DOMContentLoaded',boot);</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
